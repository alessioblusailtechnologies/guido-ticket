<header class="topbar">
  <div class="title-block">
    <h1 class="title">{{ title }}</h1>
    <span class="subtitle">{{ subtitle }}</span>
  </div>

  <div class="actions">
    @if (usage?.model) {
      <span class="model-chip" title="Modello attivo">
        <hugeicons-icon [icon]="icons.settings" [size]="12" [strokeWidth]="1.8"></hugeicons-icon>
        {{ modelLabel(usage?.model) }}
      </span>
    }
    @if (usage && totalTokens(usage) > 0) {
      <span class="usage-chip" title="Token totali · Costo accumulato della sessione">
        <span class="usage-tokens">{{ formatTokens(totalTokens(usage)) }} token</span>
        <span class="dot-sep">·</span>
        <span class="usage-cost">{{ formatCost(usage.totalCostUsd) }}</span>
      </span>
    }
    @if (sessionId) {
      <span class="session-chip" title="ID sessione corrente">
        <span class="dot"></span>
        sessione <code>{{ shortId(sessionId) }}</code>
      </span>
    }
    <button type="button" class="profile" aria-label="Account">
      <span>U</span>
    </button>
  </div>
</header>
