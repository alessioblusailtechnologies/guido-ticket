# Copia questo file in `application-local.properties` (gitignored) e compila i valori reali.
# Poi avvia con: --spring.profiles.active=local
# In alternativa esporta le env var elencate.

# Oracle: utente con GRANT SELECT (executeReadOnlySql gira su questo datasource, Hikari forzato in read-only)
spring.datasource.url=jdbc:oracle:thin:@//db-host:1521/SERVICE_NAME
spring.datasource.username=APP_USER_RO
spring.datasource.password=

# API keys (in alternativa: env var ANTHROPIC_API_KEY / OPENAI_API_KEY)
spring.ai.anthropic.api-key=
spring.ai.openai.api-key=
